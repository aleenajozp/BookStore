apiVersion: v1
kind: Secret
metadata:
  name: bookstore-secrets
  labels:
    app: bookstore
type: Opaque
stringData:
  ADMIN_EMAIL: "admin@example.com"
  ADMIN_PASSWORD: "admin123"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bookstore-config
  labels:
    app: bookstore
data:
  PORT: "3000"
  DATABASE_URL: "mongodb://bookstore-mongodb:27017/bookStore"
  NODE_ENV: "production"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bookstore-mongodb-pvc
  labels:
    app: bookstore
    component: database
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookstore-mongodb
  labels:
    app: bookstore
    component: database
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bookstore-mongodb
  template:
    metadata:
      labels:
        app: bookstore-mongodb
    spec:
      containers:
        - name: mongodb
          image: docker.io/library/mongo:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 27017
              name: mongodb
          env:
            - name: MONGO_INITDB_DATABASE
              value: "bookStore"
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 20
            periodSeconds: 15
      volumes:
        - name: mongodb-data
          persistentVolumeClaim:
            claimName: bookstore-mongodb-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: bookstore-mongodb
  labels:
    app: bookstore
    component: database
spec:
  ports:
    - port: 27017
      targetPort: 27017
      name: mongodb
  selector:
    app: bookstore-mongodb
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: bookstore
  labels:
    app: bookstore
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: bookstore
  labels:
    app: bookstore
spec:
  runPolicy: Serial
  source:
    type: Git
    git:
      uri: https://github.com/aleenajozp/BookStore.git
      ref: main
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: bookstore:latest
  triggers:
    - type: ConfigChange
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookstore
  labels:
    app: bookstore
  annotations:
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"bookstore:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"bookstore\")].image"}]
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bookstore
  template:
    metadata:
      labels:
        app: bookstore
    spec:
      containers:
        - name: bookstore
          image: bookstore:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: bookstore-config
            - secretRef:
                name: bookstore-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: bookstore
  labels:
    app: bookstore
spec:
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: bookstore
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: bookstore
  labels:
    app: bookstore
spec:
  to:
    kind: Service
    name: bookstore
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
